name: Deploy Frappe Overlay

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Git commit currently represented by the production base image"
        required: true
        type: string
      release_tag:
        description: "Optional unique Docker tag; generated from the workflow run when omitted"
        required: false
        type: string

concurrency:
  group: erpnext-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build, stage, and promote
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Validate changed JavaScript and deployment scripts
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_REF" "$GITHUB_SHA"
          mapfile -t changed_js < <(git diff --name-only "$BASE_REF" "$GITHUB_SHA" -- '*.js')
          if (( ${#changed_js[@]} )); then
            ./node_modules/.bin/prettier --check "${changed_js[@]}"
          fi
          bash -n deployment/erpnext/prepare-patch.sh deployment/erpnext/deploy.sh

      - name: Prepare minimal image overlay
        id: release
        env:
          BASE_REF: ${{ inputs.base_ref }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="$INPUT_RELEASE_TAG"
          if [ -z "$release_tag" ]; then
            release_tag="frappe-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}"
          fi
          [[ "$release_tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          bash deployment/erpnext/prepare-patch.sh "$BASE_REF" "$GITHUB_SHA" release
          cp deployment/erpnext/Dockerfile.patch deployment/erpnext/deploy.sh release/
          chmod +x release/deploy.sh
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_assets=$(cat release/build-assets)" >> "$GITHUB_OUTPUT"

      - name: Configure SSH transport
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and execute deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          BUILD_ASSETS: ${{ steps.release.outputs.build_assets }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"
          DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_release="/home/ubuntu/gitops/releases/$RELEASE_TAG"
          ssh_options=(-i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_SSH_PORT")
          mkdir_command=$(printf 'mkdir -p %q' "$remote_release")
          ssh "${ssh_options[@]}" "$target" "$mkdir_command"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p $DEPLOY_SSH_PORT" \
            release/ "$target:$remote_release/"
          remote_command=$(printf 'RELEASE_DIR=%q RELEASE_TAG=%q BUILD_ASSETS=%q SOURCE_REF=%q bash %q' \
            "$remote_release" "$RELEASE_TAG" "$BUILD_ASSETS" "$GITHUB_SHA" "$remote_release/deploy.sh")
          ssh "${ssh_options[@]}" "$target" "$remote_command"
